{% extends "base.html" %}

{% block title %}
Login | Socially
{% endblock %}


{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="brand-icon">
            ✦
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="auth-description">
            Login to continue to Socially
        </p>


        {% if error %}

        <div class="error-box">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="auth-form"
        >

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Login
            </button>

        </form>


        <p class="auth-bottom">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create Account
            </a>

        </p>

    </div>

</div>

{% endblock %}
